version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

dev_dependencies:
  path: ">=1.9.1"
  lints: ">=6.1.0"
  # For `firebaseShellWithFlag`
  tekartik_firebase_test:
    git:
      url: https://github.com/tekartik/firebase.dart
      path: firebase_test
    version: '>=0.8.0'
  tekartik_lints:
    git:
      url: https://github.com/tekartik/common.dart
      path: packages/lints
    version: '>=0.1.0'
resolution: workspace

  name: Run CI firestore test
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # every sunday at midnight

jobs:
  test:
    name: Test on ${{ matrix.os }} / ${{ matrix.dart }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: repo_support/workflow_ci_firestore_test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dart: stable
    steps:
      - name: Setup dart
        uses: tekartik/ci.dart/.github/actions/setup_ci_dart@v1
        with:
          dart-channel: ${{ matrix.dart }}
      - run: dart --version
      - run: dart pub get
      - name: Run firestore test
        run: dart run tool/run_ci.dart
        env:
          TEKARTIK_FIREBASE_REST_TEST_SERVICE_ACCOUNT: ${{ secrets.TEKARTIK_FIREBASE_REST_TEST_SERVICE_ACCOUNT }}
          TEKARTIK_FIRESTORE_REST_TEST_ROOT_COLLECTION_PATH: ${{ secrets.TEKARTIK_FIRESTORE_REST_TEST_ROOT_COLLECTION_PATH }}
          TEKARTIK_GITHUB_ACTIONS_OS: ${{ matrix.os }}
          TEKARTIK_GITHUB_ACTIONS_DART: ${{ matrix.dart }}
